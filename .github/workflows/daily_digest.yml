name: Daily Current Affairs Dispatch

on:
  schedule:
    # Runs every morning at 01:17 UTC (~06:47 AM IST)
    # (Off the top-of-hour minute to avoid GitHub's busiest queue slot)
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      exam:
        description: 'Target Exam (upsc, bank, ssc, rrb, all)'
        required: true
        default: 'all'
      channel:
        description: 'Channel (telegram, gmail, both)'
        required: true
        default: 'both'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Current Affairs Dispatcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py --channel ${{ inputs.channel || 'both' }} --exam ${{ inputs.exam || 'all' }} --save-html daily_digest.html

      - name: Archive today's digest and rebuild manifest
        run: |
          mkdir -p docs/archive
          DATE=$(date -u +%F)
          cp daily_digest.html "docs/archive/${DATE}.html"
          python3 -c "
          import os, json
          files = sorted(f[:-5] for f in os.listdir('docs/archive') if f.endswith('.html'))
          with open('docs/archive/manifest.json', 'w') as fh:
              json.dump(files, fh)
          "

      - name: Commit archive back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/archive
          git diff --cached --quiet || git commit -m "Archive digest for $(date -u +%F)"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
