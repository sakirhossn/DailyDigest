<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Current Affairs — Archive</title>
<style>
  :root{
    --bg:#16202B;
    --panel:#1B2733;
    --panel-2:#1F2E3D;
    --border:#2E4054;
    --cream:#F4EFE6;
    --slate:#8DA0B3;
    --gold:#D9A441;
    --gold-dim:#8A6B2E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--cream);
    font-family:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
    min-height:100vh;
  }
  header{
    padding:28px clamp(16px,4vw,48px) 20px;
    border-bottom:1px solid var(--border);
  }
  header h1{
    font-family:"Source Serif 4",Georgia,"Times New Roman",serif;
    font-weight:600;
    font-size:clamp(22px,3vw,30px);
    margin:0 0 4px;
    letter-spacing:0.2px;
  }
  header p{
    margin:0;
    color:var(--slate);
    font-size:14px;
  }
  .layout{
    display:grid;
    grid-template-columns:320px 1fr;
    gap:0;
    min-height:calc(100vh - 92px);
  }
  @media (max-width:820px){
    .layout{grid-template-columns:1fr;}
  }

  /* --- Calendar column --- */
  .calendar-col{
    border-right:1px solid var(--border);
    padding:24px clamp(16px,3vw,28px);
  }
  @media (max-width:820px){
    .calendar-col{border-right:none;border-bottom:1px solid var(--border);}
  }
  .month-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
  }
  .month-nav button{
    background:none;
    border:1px solid var(--border);
    color:var(--cream);
    width:32px;height:32px;
    border-radius:4px;
    cursor:pointer;
    font-size:15px;
    line-height:1;
  }
  .month-nav button:hover{border-color:var(--gold-dim);}
  .month-nav button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .month-nav button:disabled{opacity:0.3;cursor:default;}
  .month-label{
    font-family:"Source Serif 4",Georgia,serif;
    font-size:17px;
  }
  .weekdays,.days{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:4px;
  }
  .weekdays{
    margin-bottom:6px;
    color:var(--slate);
    font-size:11px;
  }
  .weekdays div{text-align:center;padding:4px 0;}
  .day-cell{
    aspect-ratio:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    border-radius:5px;
    background:transparent;
    border:1px solid transparent;
    color:var(--slate);
    font-size:13px;
    font-family:"Source Serif 4",Georgia,serif;
    cursor:default;
    position:relative;
  }
  .day-cell.empty{visibility:hidden;}
  .day-cell.available{
    color:var(--cream);
    cursor:pointer;
    border-color:var(--border);
  }
  .day-cell.available:hover{border-color:var(--gold-dim);}
  .day-cell.available:focus-visible{outline:2px solid var(--gold);outline-offset:1px;}
  .day-cell .dot{
    width:4px;height:4px;border-radius:50%;
    background:var(--gold-dim);
  }
  .day-cell.available .dot{background:var(--gold);}
  .day-cell.selected{
    background:var(--gold);
    color:#1B2733;
    border-color:var(--gold);
  }
  .day-cell.selected .dot{background:#1B2733;}
  .day-cell.today:not(.selected){border-color:var(--slate);}

  .legend{
    margin-top:18px;
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--slate);
    font-size:12px;
  }
  .legend .dot{width:4px;height:4px;border-radius:50%;background:var(--gold);}

  .jump-latest{
    margin-top:20px;
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--cream);
    padding:9px 12px;
    border-radius:5px;
    font-size:13px;
    cursor:pointer;
    font-family:inherit;
  }
  .jump-latest:hover{border-color:var(--gold-dim);}

  /* --- Content column --- */
  .content-col{
    display:flex;
    flex-direction:column;
    min-height:400px;
  }
  .content-head{
    padding:20px clamp(16px,3vw,32px);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
  }
  .content-head .date-big{
    font-family:"Source Serif 4",Georgia,serif;
    font-size:20px;
  }
  .content-head .weekday-small{
    color:var(--slate);
    font-size:13px;
  }
  .frame-wrap{
    flex:1;
    position:relative;
    background:var(--panel);
  }
  iframe{
    width:100%;height:100%;
    min-height:600px;
    border:0;
    background:#fff;
  }
  .empty-state{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:8px;
    color:var(--slate);
    padding:40px 20px;
    text-align:center;
  }
  .empty-state .big{
    font-family:"Source Serif 4",Georgia,serif;
    font-size:19px;
    color:var(--cream);
  }
</style>
</head>
<body>

<header>
  <h1>Daily Current Affairs</h1>
  <p>UPSC · Bank · SSC · RRB — archive of every day's bulletin</p>
</header>

<div class="layout">
  <div class="calendar-col">
    <div class="month-nav">
      <button id="prevMonth" aria-label="Previous month">‹</button>
      <span class="month-label" id="monthLabel"></span>
      <button id="nextMonth" aria-label="Next month">›</button>
    </div>
    <div class="weekdays">
      <div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div>
    </div>
    <div class="days" id="daysGrid"></div>
    <div class="legend"><span class="dot"></span> digest available</div>
    <button class="jump-latest" id="jumpLatest">Jump to latest</button>
  </div>

  <div class="content-col" id="contentCol">
    <!-- filled by JS -->
  </div>
</div>

<script>
(function(){
  const WEEKDAY_NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  let availableDates = [];   // ["2026-09-10", ...]
  let availableSet = new Set();
  let viewYear, viewMonth;   // month is 0-indexed
  let selectedDate = null;

  const daysGrid = document.getElementById('daysGrid');
  const monthLabel = document.getElementById('monthLabel');
  const contentCol = document.getElementById('contentCol');
  const prevBtn = document.getElementById('prevMonth');
  const nextBtn = document.getElementById('nextMonth');
  const jumpLatestBtn = document.getElementById('jumpLatest');

  function pad(n){ return n < 10 ? '0' + n : '' + n; }

  function fetchManifest(){
    return fetch('archive/manifest.json', {cache:'no-store'})
      .then(r => { if(!r.ok) throw new Error('no manifest'); return r.json(); })
      .catch(() => []);
  }

  function renderCalendar(){
    monthLabel.textContent = MONTH_NAMES[viewMonth] + ' ' + viewYear;
    daysGrid.innerHTML = '';

    const firstOfMonth = new Date(viewYear, viewMonth, 1);
    const startOffset = firstOfMonth.getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const todayStr = todayISO();

    for(let i = 0; i < startOffset; i++){
      const cell = document.createElement('div');
      cell.className = 'day-cell empty';
      daysGrid.appendChild(cell);
    }

    for(let d = 1; d <= daysInMonth; d++){
      const iso = viewYear + '-' + pad(viewMonth+1) + '-' + pad(d);
      const cell = document.createElement('div');
      const isAvailable = availableSet.has(iso);
      cell.className = 'day-cell' + (isAvailable ? ' available' : '') + (iso === selectedDate ? ' selected' : '') + (iso === todayStr ? ' today' : '');
      cell.tabIndex = isAvailable ? 0 : -1;
      cell.innerHTML = '<span>' + d + '</span><span class="dot"></span>';
      if(isAvailable){
        cell.addEventListener('click', () => selectDate(iso));
        cell.addEventListener('keydown', (e) => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); selectDate(iso); } });
      }
      daysGrid.appendChild(cell);
    }

    const hasPrevAvailable = availableDates.some(d => d < viewYear + '-' + pad(viewMonth+1) + '-01');
    const hasNextAvailable = availableDates.some(d => d > viewYear + '-' + pad(viewMonth+1) + '-' + pad(daysInMonth));
    prevBtn.disabled = availableDates.length > 0 && !hasPrevAvailable;
    nextBtn.disabled = availableDates.length > 0 && !hasNextAvailable;
  }

  function todayISO(){
    const t = new Date();
    return t.getFullYear() + '-' + pad(t.getMonth()+1) + '-' + pad(t.getDate());
  }

  function selectDate(iso){
    selectedDate = iso;
    const [y,m,d] = iso.split('-').map(Number);
    if(y !== viewYear || (m-1) !== viewMonth){
      viewYear = y; viewMonth = m - 1;
    }
    renderCalendar();
    renderContent(iso);
  }

  function renderContent(iso){
    const [y,m,d] = iso.split('-').map(Number);
    const dateObj = new Date(y, m-1, d);
    const weekday = WEEKDAY_NAMES[dateObj.getDay()];
    const pretty = MONTH_NAMES[m-1] + ' ' + d + ', ' + y;

    contentCol.innerHTML =
      '<div class="content-head">' +
        '<span class="date-big">' + pretty + '</span>' +
        '<span class="weekday-small">' + weekday + '</span>' +
      '</div>' +
      '<div class="frame-wrap"><iframe src="archive/' + iso + '.html" title="Digest for ' + iso + '"></iframe></div>';
  }

  function renderEmpty(){
    contentCol.innerHTML =
      '<div class="empty-state">' +
        '<div class="big">No digest archived yet</div>' +
        '<div>Once the daily workflow runs, dates will appear here.</div>' +
      '</div>';
  }

  prevBtn.addEventListener('click', () => {
    viewMonth--;
    if(viewMonth < 0){ viewMonth = 11; viewYear--; }
    renderCalendar();
  });
  nextBtn.addEventListener('click', () => {
    viewMonth++;
    if(viewMonth > 11){ viewMonth = 0; viewYear++; }
    renderCalendar();
  });
  jumpLatestBtn.addEventListener('click', () => {
    if(availableDates.length) selectDate(availableDates[availableDates.length - 1]);
  });

  fetchManifest().then(dates => {
    availableDates = (dates || []).slice().sort();
    availableSet = new Set(availableDates);

    const latest = availableDates.length ? availableDates[availableDates.length - 1] : null;
    const now = new Date();
    viewYear = now.getFullYear();
    viewMonth = now.getMonth();

    if(latest){
      const [y,m] = latest.split('-').map(Number);
      viewYear = y; viewMonth = m - 1;
      renderCalendar();
      selectDate(latest);
    } else {
      renderCalendar();
      renderEmpty();
    }
  });
})();
</script>

</body>
</html>
