<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Current Affairs — Archive</title>
<style>
  :root{
    --bg:#F7F5F1;
    --panel:#FFFFFF;
    --border:#E3DFD6;
    --ink:#1E2530;
    --slate:#7A7267;
    --gold:#B9812B;
    --gold-soft:#F1E2C4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
    min-height:100vh;
  }

  header{
    padding:16px clamp(14px,3vw,40px) 10px;
    border-bottom:1px solid var(--border);
    background:var(--bg);
  }
  header h1{
    font-family:"Source Serif 4",Georgia,"Times New Roman",serif;
    font-weight:600;
    font-size:clamp(19px,2.6vw,24px);
    margin:0 0 2px;
    letter-spacing:0.2px;
    color:var(--ink);
  }
  header p{
    margin:0;
    color:var(--slate);
    font-size:13px;
  }
  /* Laptop / desktop: drop the heading entirely, keep just the control bar */
  @media (min-width:700px){
    header h1, header p{display:none;}
    header{padding:14px clamp(20px,3vw,40px);}
  }

  .controls{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    padding:14px clamp(14px,3vw,40px);
    border-bottom:1px solid var(--border);
    background:var(--bg);
  }
  .controls label{
    font-size:13px;
    color:var(--slate);
  }
  .controls input[type="date"]{
    font-family:inherit;
    font-size:14px;
    color:var(--ink);
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:5px;
    padding:7px 10px;
  }
  .controls input[type="date"]:focus-visible{outline:2px solid var(--gold);outline-offset:1px;}
  .jump-latest{
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--ink);
    padding:7px 12px;
    border-radius:5px;
    font-size:13px;
    cursor:pointer;
    font-family:inherit;
  }
  .jump-latest:hover{border-color:var(--gold);}
  .avail-note{
    font-size:12px;
    color:var(--slate);
  }

  /* --- Content --- */
  .content-col{
    display:flex;
    flex-direction:column;
    min-height:400px;
    background:var(--bg);
  }
  .content-head{
    padding:14px clamp(14px,3vw,40px);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:6px;
  }
  .content-head .date-big{
    font-family:"Source Serif 4",Georgia,serif;
    font-size:18px;
    color:var(--ink);
  }
  .content-head .weekday-small{
    color:var(--slate);
    font-size:12px;
  }
  .frame-wrap{
    flex:1;
    position:relative;
    background:var(--panel);
  }
  iframe{
    width:100%;height:100%;
    min-height:600px;
    border:0;
    background:#fff;
    display:block;
  }
  @media (max-width:700px){
    iframe{min-height:75vh;}
  }
  .empty-state{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:8px;
    color:var(--slate);
    padding:32px 16px;
    text-align:center;
  }
  .empty-state .big{
    font-family:"Source Serif 4",Georgia,serif;
    font-size:17px;
    color:var(--ink);
  }
</style>
</head>
<body>

<header>
  <h1>Daily Current Affairs</h1>
  <p>UPSC · Bank · SSC · RRB — archive of every day's bulletin</p>
</header>

<div class="controls">
  <label for="datePick">Choose date</label>
  <input type="date" id="datePick">
  <button class="jump-latest" id="jumpLatest">Jump to latest</button>
  <span class="avail-note" id="availNote"></span>
</div>

<div class="content-col" id="contentCol">
  <!-- filled by JS -->
</div>

<script>
(function(){
  const WEEKDAY_NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  let availableDates = [];   // sorted ["2026-09-10", ...]
  let availableSet = new Set();

  const datePick = document.getElementById('datePick');
  const contentCol = document.getElementById('contentCol');
  const jumpLatestBtn = document.getElementById('jumpLatest');
  const availNote = document.getElementById('availNote');

  function fetchManifest(){
    return fetch('archive/manifest.json', {cache:'no-store'})
      .then(r => { if(!r.ok) throw new Error('no manifest'); return r.json(); })
      .catch(() => []);
  }

  function nearestAvailable(iso){
    if(!availableDates.length) return null;
    if(availableSet.has(iso)) return iso;
    let best = availableDates[0];
    let bestDiff = Infinity;
    const target = new Date(iso).getTime();
    for(const d of availableDates){
      const diff = Math.abs(new Date(d).getTime() - target);
      if(diff < bestDiff){ bestDiff = diff; best = d; }
    }
    return best;
  }

  function selectDate(iso, opts){
    opts = opts || {};
    const resolved = availableSet.has(iso) ? iso : nearestAvailable(iso);
    if(!resolved){ renderEmpty(); return; }
    datePick.value = resolved;
    availNote.textContent = (resolved !== iso && !opts.silent) ? 'No digest for that date — showing nearest available' : '';
    renderContent(resolved);
  }

  function renderContent(iso){
    const [y,m,d] = iso.split('-').map(Number);
    const dateObj = new Date(y, m-1, d);
    const weekday = WEEKDAY_NAMES[dateObj.getDay()];
    const pretty = MONTH_NAMES[m-1] + ' ' + d + ', ' + y;

    contentCol.innerHTML =
      '<div class="content-head">' +
        '<span class="date-big">' + pretty + '</span>' +
        '<span class="weekday-small">' + weekday + '</span>' +
      '</div>' +
      '<div class="frame-wrap"><iframe src="archive/' + iso + '.html" title="Digest for ' + iso + '"></iframe></div>';
  }

  function renderEmpty(){
    contentCol.innerHTML =
      '<div class="empty-state">' +
        '<div class="big">No digest archived yet</div>' +
        '<div>Once the daily workflow runs, dates will appear here.</div>' +
      '</div>';
  }

  datePick.addEventListener('change', () => {
    if(datePick.value) selectDate(datePick.value);
  });
  jumpLatestBtn.addEventListener('click', () => {
    if(availableDates.length) selectDate(availableDates[availableDates.length - 1]);
  });

  fetchManifest().then(dates => {
    availableDates = (dates || []).slice().sort();
    availableSet = new Set(availableDates);

    if(availableDates.length){
      datePick.min = availableDates[0];
      datePick.max = availableDates[availableDates.length - 1];
      selectDate(availableDates[availableDates.length - 1], {silent:true});
    } else {
      renderEmpty();
    }
  });
})();
</script>

</body>
</html>
